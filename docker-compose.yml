services:
  music_bot:
    image: ${MUSICBOT_IMAGE:-musicbot:latest}
    build: .
    restart: unless-stopped
    init: true
    # The local Bot API stores downloads with group 101. The shared volume is read-only,
    # and voice recognition opens only paths inside this bot's token directory.
    group_add:
      - "101"
    env_file:
      - .env
    environment:
      YTDLP_COOKIES_FILE: /app/cookies.txt
      HTTP_ADDR: 0.0.0.0:8080
      LOG_FORMAT: json
    volumes:
      - type: bind
        source: ./downloads
        target: /app/downloads
        bind:
          create_host_path: false
      - type: volume
        source: telegram-bot-api-data
        target: /var/lib/telegram-bot-api
        read_only: true
      - type: bind
        source: ./cache
        target: /app/cache
        bind:
          create_host_path: false
      - type: bind
        source: ./cookies.txt
        target: /app/cookies.txt
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,exec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: "2.0"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Optional SOCKS proxy with a CIS exit for Yandex Music, which answers HTTP 451 elsewhere.
  # Enabled by COMPOSE_PROFILES=yandex-relay and YANDEX_PROXY=socks5h://yandex-relay:1080
  # in .env; see docs/configuration.md. It is reachable only on the project network.
  yandex-relay:
    image: ghcr.io/xtls/xray-core:26.3.27
    profiles:
      - yandex-relay
    restart: unless-stopped
    user: "10001:10001"
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - type: bind
        source: ./yandex-relay.json
        target: /etc/xray/config.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Optional YouTube PO token provider (bgutil): without PO tokens YouTube answers most media
  # requests with 403. Enabled by COMPOSE_PROFILES=bgutil-pot and
  # YTDLP_POT_PROVIDER_URL=http://bgutil-pot:4416 in .env; the bot image ships the matching yt-dlp
  # plugin. See docs/configuration.md. It is reachable only on the project network.
  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0@sha256:ed86b6fdd5e430ddd7c8ce1adb55e1ab54db7c7dbc1bcbf3a82454a85b971164
    profiles:
      - bgutil-pot
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Optional local Telegram Bot API server: it accepts uploads up to 2000 MB instead of the cloud's 50 MB.
  # Enabled by COMPOSE_PROFILES=telegram-bot-api and TELEGRAM_API_URL=http://telegram-bot-api:8081
  # in .env, with TELEGRAM_API_ID and TELEGRAM_API_HASH from my.telegram.org in telegram-bot-api.env;
  # see docs/configuration.md. It is reachable only on the project network.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.2@sha256:e0c2d269555a39d37b77ed6dd6fa5e4153b8d8399c6de9f249808682cdd942a5
    profiles:
      - telegram-bot-api
    restart: unless-stopped
    env_file:
      - path: ./telegram-bot-api.env
        required: false
    environment:
      TELEGRAM_LOCAL: "1"
    volumes:
      # The work dir holds a directory per bot token: never list or share it.
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - telegram-bot-api-temp:/tmp/telegram-bot-api
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The entrypoint chowns the work dir as root, then the server drops to its own user.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  telegram-bot-api-data:
  telegram-bot-api-temp:
