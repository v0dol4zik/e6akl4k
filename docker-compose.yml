services:
  music_bot:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      YTDLP_COOKIES_FILE: /app/cookies.txt
      HTTP_ADDR: 0.0.0.0:8080
      LOG_FORMAT: json
    volumes:
      - type: bind
        source: ./downloads
        target: /app/downloads
        bind:
          create_host_path: false
      - type: bind
        source: ./cache
        target: /app/cache
        bind:
          create_host_path: false
      - type: bind
        source: ./cookies.txt
        target: /app/cookies.txt
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,exec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: "2.0"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
